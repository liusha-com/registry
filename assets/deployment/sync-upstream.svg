<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="496" viewBox="0 0 1120 496" role="img" aria-labelledby="title desc"><title id="title">Sync the registry fork and redeploy</title><desc id="desc">Update flow diagram. Review liusha-com/registry, then use Sync fork and Update branch. Workers Builds runs npm run deploy to apply pending migrations and deploy using wrangler.jsonc. Existing runtime secrets remain on the Worker.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527198"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b45}.muted{fill:#5b6d83}.mono{font-family:Consolas,monospace}.label{font-size:15px}.value{font-size:20px}.small{font-size:14px}.title{font-size:29px;font-weight:700}.card{fill:#fff;stroke:#d4dfec;stroke-width:1.5}.line{stroke:#527198;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1120" height="496" rx="16" fill="#f3f6fb"/><text x="36" y="48" class="title">Update Registry from upstream</text><text x="36" y="79" class="muted small">UPDATE FLOW DIAGRAM · Keep fork-only source changes to a minimum</text><rect x="36" y="119" width="316" height="192" rx="10" class="card"/><text x="60" y="155" class="label muted">01</text><text x="60" y="191" class="value">Review upstream</text><text x="60" y="232" class="mono" font-size="17">liusha-com/registry</text><text x="60" y="266" class="small muted">Review migrations and configuration</text><rect x="402" y="119" width="316" height="192" rx="10" class="card"/><text x="426" y="155" class="label muted">02</text><text x="426" y="191" class="value">Update your fork</text><text x="426" y="232" class="mono" font-size="17">YOUR_ACCOUNT/registry</text><text x="426" y="266" class="small muted">main</text><rect x="768" y="119" width="316" height="192" rx="10" class="card"/><text x="792" y="155" class="label muted">03</text><text x="792" y="191" class="value">Migrate + deploy</text><text x="792" y="232" class="mono" font-size="16">npm run deploy</text><text x="792" y="266" class="small muted">New production commit</text><path d="M 354 214 L 394 214" class="line"/><path d="M 720 214 L 760 214" class="line"/><rect x="421" y="284" width="278" height="44" rx="7" fill="#1b7741"/><text x="439" y="312" font-size="16" style="fill:white">Sync fork → Update branch</text><rect x="36" y="355" width="1048" height="104" rx="10" fill="#eaf7ef" stroke="#bedcc9"/><text x="60" y="391" class="value">ENV and storage from wrangler.jsonc · Runtime secrets retained</text><text x="60" y="424" class="muted small">Pending migrations run before publication. Keep production resource selections aligned in Git.</text></svg>
