<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="666" viewBox="0 0 1120 666" role="img" aria-labelledby="title desc"><title id="title">Connect your registry fork to Workers Builds</title><desc id="desc">Configuration diagram. Fork liusha-com/registry and connect YOUR_ACCOUNT/registry. Deploy main with npm run deploy, which provisions storage and applies migrations. Then configure GitHub secrets and verify runtime variables and bindings.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527198"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172b45}.muted{fill:#5b6d83}.mono{font-family:Consolas,monospace}.label{font-size:15px}.value{font-size:20px}.small{font-size:14px}.title{font-size:29px;font-weight:700}.card{fill:#fff;stroke:#d4dfec;stroke-width:1.5}.line{stroke:#527198;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1120" height="666" rx="16" fill="#f3f6fb"/><text x="36" y="48" class="title">Registry / GitHub-connected deployment</text><text x="36" y="79" class="muted small">CONFIGURATION DIAGRAM · Illustrative values, not a Cloudflare dashboard screenshot</text>
<rect x="36" y="112" width="410" height="191" rx="10" class="card"/><text x="60" y="144" class="label muted">1 / FORK THE SOURCE</text><text x="60" y="183" class="value mono">liusha-com/registry</text><path d="M 80 196 L 80 218" class="line"/><text x="105" y="217" class="small muted">GitHub → Fork</text><text x="60" y="255" class="value mono">YOUR_ACCOUNT/registry</text><text x="60" y="281" class="small muted">Connect this fork to Cloudflare.</text>
<path d="M 446 205 L 486 205" class="line"/>
<rect x="492" y="112" width="592" height="386" rx="10" class="card"/><rect x="493" y="113" width="590" height="55" rx="9" fill="#e8f0fe"/><text x="516" y="148" class="value">2 / Workers Builds settings</text><text x="516" y="207" class="label muted">Worker name</text><text x="724" y="207" class="value mono">registry</text><text x="516" y="255" class="label muted">Production branch</text><text x="724" y="255" class="value mono">main</text><text x="516" y="303" class="label muted">Root directory</text><text x="724" y="303" class="value mono">/</text><text x="516" y="351" class="label muted">Build command</text><text x="724" y="351" class="value mono">npm run build</text><rect x="506" y="372" width="563" height="43" rx="5" fill="#eaf7ef"/><text x="516" y="399" class="label muted">Deploy command</text><text x="690" y="399" class="mono" font-size="17">npm run deploy</text><text x="516" y="447" class="label muted">Build variable</text><text x="724" y="447" class="value mono">NODE_VERSION = 22</text><rect x="36" y="323" width="410" height="175" rx="10" class="card"/><text x="60" y="359" class="label muted">3 / AFTER THE FIRST DEPLOY</text><text x="60" y="397" class="value">Verify runtime text variables</text><text x="60" y="431" class="value">Add two GitHub secrets</text><text x="60" y="465" class="value">Save and deploy settings</text>
<rect x="36" y="521" width="1048" height="107" rx="10" class="card"/><text x="60" y="554" class="label muted">AUTOMATIC STORAGE SETUP + MIGRATIONS / VERIFY BINDINGS AFTER DEPLOY</text><text x="60" y="592" class="value mono">DB → wasmd-registry</text><text x="515" y="592" class="value mono">BLOBS → wasmd-registry-blobs</text></svg>
