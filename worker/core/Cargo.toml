[package]
name = "registry-worker-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
wasm-bindgen = "0.2.114"
wasmparser = "0.258"
wit-component = "0.258"
wit-parser = "0.258"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
